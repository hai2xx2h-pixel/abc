<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#2f3347">

    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

    <title>二维码通行</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background-color: #2f3347;
            -webkit-user-select: none;
            user-select: none;
            overflow-x: hidden;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang SC",
                "Helvetica Neue",
                STHeiti,
                sans-serif;

            /* Background gradient thay cho background.png thiếu */
            background: radial-gradient(circle at center, #3a3f58 0%, #2f3347 100%);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;

            color: white;

            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-bottom: 30px;
        }

        .top-status-bar {
            width: 100%;
            height: 44px;
            background-color: #e2e4e9;
            flex-shrink: 0;
        }

        .header {
            margin-top: 25px;
            font-size: 17px;
            color: #F5D57F;
            font-weight: 300;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .card {
            margin-top: 20px;
            width: 84%;
            max-width: 310px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            background-color: #f2c75b;
            padding: 14px 8px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 300;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .circle1,
        .circle2 {
            position: absolute;
            background-color: #2f3347;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            bottom: -6px;
            z-index: 10;
        }

        .circle1 {
            left: -6px;
        }

        .circle2 {
            right: -6px;
        }

        .card-body {
            background-color: #ffffff;
            padding: 16px 15px 14px 15px;
            text-align: center;
            color: #000;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time {
            font-size: 14px;
            font-weight: 300;
            color: #111111;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
            line-height: 1.2;
            width: 100%;
        }

        #qrcode {
            width: 220px;
            height: 220px;
            min-width: 220px;
            min-height: 220px;
            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        #qrcode img,
        #qrcode canvas {
            width: 220px !important;
            height: 220px !important;
            display: block !important;
        }

        .refresh {
            margin-top: 14px;
            width: 100%;

            display: flex;
            justify-content: center;
        }

        .refresh-title {
            cursor: pointer;
            font-size: 12px;
            color: #666666;
            font-weight: 300;
            -webkit-tap-highlight-color: transparent;
        }

        .status-box {
            margin-top: 12px;

            display: flex;
            flex-direction: column;
            align-items: center;

            color: #2eb85c;
        }

        .status-label {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.5px;

            animation: pulse-green 1.2s infinite ease-in-out;
        }

        .status-timer {
            font-size: 18px;
            font-weight: 300;
            margin-top: 2px;
            letter-spacing: 0.5px;
            opacity: 1 !important;

            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse-green {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }

            100% {
                opacity: 1;
            }
        }

        .note {
            margin: 22px 10% 0 10%;
            font-size: 13px;
            font-weight: 300;
            color: #E6DCBD;
            line-height: 1.6;
            text-align: center;
        }

        /* Thanh tiến trình hiển thị khi nhấn giữ 5s */
        .hold-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background-color: #38a754;
            width: 0%;
            transition: width 0.1s linear;
            z-index: 999;
        }

        /* Nút Bánh răng Cài đặt & Bảng Điều khiển */
        .settings-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        .settings-panel {
            display: none;
            position: fixed;
            bottom: 60px;
            right: 15px;
            width: 260px;
            background: #ffffff;
            color: #333;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 101;
            font-size: 13px;
        }

        .settings-panel.active {
            display: block;
        }

        .settings-panel h4 {
            margin-bottom: 10px;
            font-weight: 600;
            color: #2f3347;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .settings-panel label {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            color: #666;
        }

        .settings-panel input {
            width: 100%;
            padding: 6px 8px;
            margin-top: 3px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }

        .settings-panel button {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #2f3347;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .settings-panel button.btn-toggle {
            background: #38a754;
        }
    </style>
</head>

<body>

    <!-- Thanh tiến trình nhấn giữ -->
    <div class="hold-progress-bar" id="holdProgressBar"></div>

    <div class="top-status-bar"></div>

    <div class="header" id="userInfoHeader">
        V25111639(Nguyễn Văn Hải)
    </div>

    <div class="card">

        <div class="card-header" id="cardHeader">

            <span id="headerText">
                将二维码对准扫描器刷码出场
            </span>

            <div class="circle1"></div>
            <div class="circle2"></div>

        </div>

        <div class="card-body">

            <div class="time" id="currentTime">
                --
            </div>

            <div id="qrcode"></div>

            <div class="refresh">
                <span onclick="generateQRCode(event)" class="refresh-title">
                    刷新二维码
                </span>
            </div>

            <div class="status-box">

                <div class="status-label">
                    已生效
                </div>

                <div class="status-timer" id="statusTimer">
                    00:00:00
                </div>

            </div>

        </div>

    </div>

    <div class="note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>

    <!-- Nút Cài đặt & Bảng Điều khiển ẩn -->
    <div class="settings-btn" onclick="toggleSettingsPanel(event)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h4>Cấu hình 通行</h4>
        <label>Mã nhân viên (ID):</label>
        <input type="text" id="inputEmpId" value="V25111639">

        <label>Tên nhân viên:</label>
        <input type="text" id="inputEmpName" value="Nguyễn Văn Hải">

        <button onclick="saveUserInfo()">Lưu thông tin</button>
        <button class="btn-toggle" onclick="toggleHeaderColor(); toggleSettingsPanel(event);">Đổi Trạng Thái (Xanh/Vàng)</button>
    </div>


    <script>
        /* =====================================================
           CẤU HÌNH BAN ĐẦU
        ===================================================== */
        let employeeId = localStorage.getItem("qr_employee_id") || "V25111639";
        let employeeName = localStorage.getItem("qr_employee_name") || "Nguyễn Văn Hải";

        function updateUserInfoDisplay() {
            document.getElementById("userInfoHeader").textContent = `${employeeId}(${employeeName})`;
        }
        updateUserInfoDisplay();

        function saveUserInfo() {
            employeeId = document.getElementById("inputEmpId").value.trim();
            employeeName = document.getElementById("inputEmpName").value.trim();
            localStorage.setItem("qr_employee_id", employeeId);
            localStorage.setItem("qr_employee_name", employeeName);
            updateUserInfoDisplay();
            generateQRCode();
            alert("Đã cập nhật thông tin thành công!");
        }

        function toggleSettingsPanel(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById("settingsPanel");
            panel.classList.toggle("active");
        }

        document.addEventListener("click", function (e) {
            const panel = document.getElementById("settingsPanel");
            const btn = document.querySelector(".settings-btn");
            if (panel.classList.contains("active") && !panel.contains(e.target) && !btn.contains(e.target)) {
                panel.classList.remove("active");
            }
        });

        /* =====================================================
           KEY LƯU TRỮ LOCALSTORAGE
        ===================================================== */
        const TIMER_STORAGE_KEY = "qr_access_start_time";
        const COLOR_STORAGE_KEY = "qr_access_color";

        /* =====================================================
           HÀM PAD HỖ TRỢ ĐỊNH DẠNG SỐ (01, 02...)
        ===================================================== */
        function pad(num) {
            return num < 10 ? "0" + num : String(num);
        }

        /* =====================================================
           KHÔI PHỤC TRẠNG THÁI MÀU (GREEN / YELLOW)
        ===================================================== */
        let savedColor = localStorage.getItem(COLOR_STORAGE_KEY);
        let isGreen = savedColor === "green";

        const cardHeader = document.getElementById("cardHeader");
        const headerText = document.getElementById("headerText");

        function applyHeaderColor() {
            if (isGreen) {
                cardHeader.style.backgroundColor = "#38a754";
                headerText.textContent = "将二维码对准扫描器刷码进场";
            } else {
                cardHeader.style.backgroundColor = "#f2c75b";
                headerText.textContent = "将二维码对准扫描器刷码出场";
            }
        }

        /* =====================================================
           KHÔI PHỤC THỜI ĐIỂM BẮT ĐẦU TIMER
        ===================================================== */
        let startTime = localStorage.getItem(TIMER_STORAGE_KEY);

        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
        } else {
            startTime = Number(startTime);
        }

        /* =====================================================
           CẬP NHẬT ĐỒNG HỒ VÀ BỘ ĐẾM GIỜ
        ===================================================== */
        function updateAllTimers() {
            const now = new Date();

            /* Thời gian hiện tại phía trên QR */
            const formattedTime =
                `${now.getFullYear()}-` +
                `${now.getMonth() + 1}-` +
                `${now.getDate()} ` +
                `${pad(now.getHours())}:` +
                `${pad(now.getMinutes())}:` +
                `${pad(now.getSeconds())}`;

            document.getElementById("currentTime").textContent = formattedTime;

            /* Tính thời gian đã chạy từ mốc startTime */
            const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startTime) / 1000));

            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;

            document.getElementById("statusTimer").textContent =
                `${pad(hours)}:` +
                `${pad(minutes)}:` +
                `${pad(seconds)}`;
        }

        /* =====================================================
           RESET TIMER
        ===================================================== */
        function resetTimer() {
            startTime = Date.now();
            localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
            document.getElementById("statusTimer").textContent = "00:00:00";
            updateAllTimers();
        }

        /* =====================================================
           ĐỔI MÀU + RESET TIMER
        ===================================================== */
        function toggleHeaderColor() {
            isGreen = !isGreen;
            localStorage.setItem(COLOR_STORAGE_KEY, isGreen ? "green" : "yellow");
            applyHeaderColor();
            resetTimer();
        }

        /* =====================================================
           TẠO QR CODE ĐỘNG
        ===================================================== */
        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");

            const formattedTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);

            const accessData =
                `https://YOUR-AUTHORIZED-DOMAIN/access` +
                `?id=${encodeURIComponent(employeeId)}` +
                `&name=${encodeURIComponent(employeeName)}` +
                `&time=${encodeURIComponent(formattedTime)}` +
                `&token=${encodeURIComponent(uniqueToken)}`;

            const qrcodeElement = document.getElementById("qrcode");
            qrcodeElement.innerHTML = "";

            new QRCode(qrcodeElement, {
                text: accessData,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        /* =====================================================
           NHẤN GIỮ 5 GIÂY VÙNG TRỐNG ĐỂ ĐỔI MÀU
        ===================================================== */
        let pressTimer = null;
        let progressInterval = null;
        const HOLD_DURATION = 5000;
        const progressBar = document.getElementById("holdProgressBar");

        function startPress(e) {
            // Không tính khi nhấn vào thẻ card, thanh status top, hoặc panel cài đặt
            if (
                e.target.closest(".card") ||
                e.target.closest(".top-status-bar") ||
                e.target.closest(".settings-panel") ||
                e.target.closest(".settings-btn")
            ) {
                return;
            }

            cancelPress();

            let startTimePress = Date.now();
            progressBar.style.width = "0%";

            progressInterval = setInterval(() => {
                let elapsed = Date.now() - startTimePress;
                let pct = Math.min(100, (elapsed / HOLD_DURATION) * 100);
                progressBar.style.width = pct + "%";
            }, 50);

            pressTimer = setTimeout(() => {
                toggleHeaderColor();
                cancelPress();
            }, HOLD_DURATION);
        }

        function cancelPress() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            progressBar.style.width = "0%";
        }

        document.addEventListener("touchstart", startPress, { passive: true });
        document.addEventListener("touchend", cancelPress);
        document.addEventListener("touchcancel", cancelPress);
        document.addEventListener("mousedown", startPress);
        document.addEventListener("mouseup", cancelPress);
        document.addEventListener("mouseleave", cancelPress);

        /* =====================================================
           KHỞI CHẠY ỨNG DỤNG
        ===================================================== */
        applyHeaderColor();
        updateAllTimers();
        generateQRCode();

        setInterval(updateAllTimers, 1000);
    </script>

</body>

</html>
