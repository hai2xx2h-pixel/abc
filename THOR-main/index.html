
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#252a3d">

    <title>二维码通行</title>

    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

    <style>
        /* ==============================
           1. RESET
        ============================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #252a3d;
        }

        body {
            position: fixed;
            inset: 0;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #252a3d;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang SC",
                "Helvetica Neue",
                Arial,
                sans-serif;

            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        /* ==============================
           2. NỀN RIÊNG PHỦ TOÀN MÀN HÌNH
           Không đặt height: 100dvh ở đây.
        ============================== */
        .background-layer {
            position: fixed;
            inset: 0;
            z-index: 0;

            background-color: #252a3d;
            background-image: url("background.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;

            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* ==============================
           3. MÀN HÌNH CHÍNH
        ============================== */
        .app-screen {
            position: fixed;
            inset: 0;
            z-index: 1;

            width: auto;
            height: auto;
            min-width: 0;
            min-height: 0;

            padding-top: calc(env(safe-area-inset-top, 0px) + 18px);
            padding-right: 0;
            padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
            padding-left: 0;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;
            overscroll-behavior: none;

            background: transparent;
        }

        /* ==============================
           4. TÊN NHÂN VIÊN
        ============================== */
        .header {
            position: relative;
            z-index: 2;

            width: 100%;
            min-height: 23px;
            flex-shrink: 0;

            margin: 0;
            padding: 0 10px;

            color: #F5D57F;
            font-size: 17px;
            font-weight: 300;
            line-height: 1.35;
            text-align: center;
            white-space: nowrap;
        }

        /* ==============================
           5. THẺ QR
        ============================== */
        .card {
            position: relative;
            z-index: 2;
            flex-shrink: 0;

            width: 68%;
            max-width: 300px;

            margin-top: 15px;
            overflow: visible;

            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* ==============================
           6. ĐẦU THẺ
        ============================== */
        .card-header {
            position: relative;

            width: 100%;
            height: 66px;
            min-height: 66px;
            padding: 12px 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background-color: #f2c75b;
            text-align: center;

            border-radius: 8px 8px 0 0;
            transition: background-color 0.25s ease;
        }

        #headerText {
            display: block;
            width: 100%;

            color: #ffffff;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.4;
            text-align: center;
            white-space: nowrap;
        }

        /* Hai chấm tròn hai bên thẻ */
        .circle1,
        .circle2 {
            position: absolute;
            bottom: -6px;
            z-index: 10;

            width: 12px;
            height: 12px;

            border-radius: 50%;
            background-color: #30364f;
        }

        .circle1 {
            left: -6px;
        }

        .circle2 {
            right: -6px;
        }

        /* ==============================
           7. THÂN THẺ
        ============================== */
        .card-body {
            width: 100%;
            padding: 13px 15px 10px;

            display: flex;
            flex-direction: column;
            align-items: center;

            color: #111111;
            background-color: #ffffff;
            text-align: center;

            border-radius: 0 0 8px 8px;
        }

        /* Thời gian hiện tại */
        .time {
            width: 100%;
            margin: 0 0 10px;

            color: #111111;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.3;
            text-align: center;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ==============================
           8. MÃ QR
        ============================== */
        #qrcode {
            width: 210px;
            height: 210px;
            min-width: 210px;
            min-height: 210px;
            max-width: 210px;
            max-height: 210px;

            margin: 0 auto;
            padding: 0;

            display: block;
            overflow: hidden;

            background: #ffffff;
            border: 0;
        }

        #qrcode img,
        #qrcode canvas {
            display: block !important;

            width: 210px !important;
            height: 210px !important;
            min-width: 210px !important;
            min-height: 210px !important;
            max-width: 210px !important;
            max-height: 210px !important;

            margin: 0 !important;
            padding: 0 !important;

            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            transform: none !important;
            filter: none !important;

            image-rendering: pixelated;
        }

        #qrcode table {
            width: 210px !important;
            height: 210px !important;

            margin: 0 !important;
            padding: 0 !important;

            border: 0 !important;
            border-spacing: 0 !important;
            border-collapse: collapse !important;
        }

        #qrcode tbody,
        #qrcode tr,
        #qrcode td {
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
        }

        /* ==============================
           9. NÚT THAO TÁC
        ============================== */
        .refresh {
            width: 100%;
            min-height: 18px;

            margin-top: 9px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .refresh.has-leave {
            justify-content: center;
            gap: 18px;
        }

        .leave-action,
        .refresh-title {
            color: #666666;
            font-size: 12px;
            font-weight: 300;
            line-height: 1.3;
            white-space: nowrap;
            cursor: pointer;
        }

        .leave-action:active,
        .refresh-title:active {
            opacity: 0.65;
        }

        /* ==============================
           10. TRẠNG THÁI VÀ ĐỒNG HỒ ĐẾM
        ============================== */
        .status-box {
            margin-top: 12px;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;
        }

        .status-label {
            color: #9AE7B3;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.3;

            animation: pulse-green 1.2s infinite ease-in-out;
        }

        .status-timer {
            margin-top: 4px;

            color: #16C653;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.3;
            letter-spacing: 0.2px;

            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse-green {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* ==============================
           11. THÔNG BÁO PHÍA DƯỚI
        ============================== */
        .note {
            position: relative;
            z-index: 2;

            width: 265px;
            max-width: 76%;
            flex-shrink: 0;

            margin: 28px auto 0;
            padding: 0;

            color: #E6DCBD;
            font-size: 13px;
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: 0;

            text-align: left;
            text-indent: 2em;

            white-space: normal;
            overflow-wrap: break-word;
        }

        /* ==============================
           12. ĐIỆN THOẠI NHỎ
        ============================== */
        @media (max-width: 360px) {
            .header {
                font-size: 15px;
            }

            .card {
                width: 78%;
            }

            .note {
                max-width: 82%;
                margin-top: 22px;
                font-size: 12px;
            }
        }

        /* ==============================
           13. MÀN HÌNH THẤP
        ============================== */
        @media (max-height: 700px) {
            .app-screen {
                padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
            }

            .card {
                margin-top: 10px;
            }

            .card-header {
                height: 58px;
                min-height: 58px;
            }

            .card-body {
                padding-top: 9px;
                padding-bottom: 8px;
            }

            .time {
                margin-bottom: 7px;
                font-size: 12px;
            }

            #qrcode,
            #qrcode img,
            #qrcode canvas {
                width: 180px !important;
                height: 180px !important;
                min-width: 180px !important;
                min-height: 180px !important;
                max-width: 180px !important;
                max-height: 180px !important;
            }

            #qrcode table {
                width: 180px !important;
                height: 180px !important;
            }

            .status-box {
                margin-top: 8px;
            }

            .note {
                margin-top: 16px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- LỚP NỀN RIÊNG, PHỦ TOÀN MÀN HÌNH -->
    <div class="background-layer" aria-hidden="true"></div>

    <main id="appScreen" class="app-screen">

        <!-- TÊN NHÂN VIÊN -->
        <div id="employeeHeader" class="header">
            V25111639 (Nguyễn Văn Hải)
        </div>

        <!-- THẺ QR -->
        <section class="card" aria-label="二维码通行卡">

            <div id="cardHeader" class="card-header">
                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>

                <div class="circle1"></div>
                <div class="circle2"></div>
            </div>

            <div class="card-body">

                <div id="currentTime" class="time">
                    ----
                </div>

                <div id="qrcode" aria-label="二维码"></div>

                <div id="qrActions" class="refresh">

                    <span id="leaveAction" class="leave-action hidden">
                        申请离场
                    </span>

                    <span
                        id="refreshQRCode"
                        class="refresh-title"
                        role="button"
                        tabindex="0"
                    >
                        刷新二维码
                    </span>

                </div>

                <div class="status-box">
                    <div class="status-label">已生效</div>

                    <div id="statusTimer" class="status-timer">
                        00:00:00
                    </div>
                </div>

            </div>
        </section>

        <!-- THÔNG BÁO -->
        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>

    </main>

    <script>
        (() => {
            "use strict";

            /* ==============================
               THÔNG TIN CÁ NHÂN
            ============================== */

            const EMPLOYEE_ID = "V25111639";
            const EMPLOYEE_NAME = "Nguyễn Văn Hải";

            const QR_SIZE = 210;
            const HOLD_DURATION = 3000;

            /*
             * ĐỊA CHỈ QR MẪU.
             * QR này chỉ hiển thị dữ liệu mẫu,
             * không đảm bảo là mã truy cập hợp lệ.
             */
            const QR_ENDPOINT =
                "https://YOUR-AUTHORIZED-DOMAIN/access";

            const STORAGE_KEY = "thor_personal_state_v1";

            /* ==============================
               LẤY CÁC PHẦN TỬ
            ============================== */

            const employeeHeader =
                document.getElementById("employeeHeader");

            const cardHeader =
                document.getElementById("cardHeader");

            const headerText =
                document.getElementById("headerText");

            const currentTime =
                document.getElementById("currentTime");

            const statusTimer =
                document.getElementById("statusTimer");

            const qrcodeElement =
                document.getElementById("qrcode");

            const qrActions =
                document.getElementById("qrActions");

            const leaveAction =
                document.getElementById("leaveAction");

            const refreshQRCode =
                document.getElementById("refreshQRCode");

            /* ==============================
               TRẠNG THÁI
            ============================== */

            let isGreen = false;
            let timerStart = Date.now();
            let pressTimer = null;

            /* ==============================
               HÀM TIỆN ÍCH
            ============================== */

            function pad(value) {
                return String(value).padStart(2, "0");
            }

            function formatDateTime(date) {
                return (
                    `${date.getFullYear()}-` +
                    `${pad(date.getMonth() + 1)}-` +
                    `${pad(date.getDate())} ` +
                    `${pad(date.getHours())}:` +
                    `${pad(date.getMinutes())}:` +
                    `${pad(date.getSeconds())}`
                );
            }

            /* ==============================
               ĐỌC TRẠNG THÁI ĐÃ LƯU
            ============================== */

            function loadLocalState() {
                try {
                    const saved = JSON.parse(
                        localStorage.getItem(STORAGE_KEY) || "null"
                    );

                    if (saved && typeof saved === "object") {
                        isGreen = saved.isGreen === true;

                        if (
                            Number.isFinite(saved.timerStart) &&
                            saved.timerStart > 0
                        ) {
                            timerStart = saved.timerStart;
                        }
                    }
                } catch (error) {
                    console.warn(
                        "Không đọc được trạng thái đã lưu:",
                        error
                    );
                }
            }

            /* ==============================
               LƯU TRẠNG THÁI
            ============================== */

            function saveLocalState() {
                try {
                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify({
                            isGreen,
                            timerStart
                        })
                    );
                } catch (error) {
                    console.warn(
                        "Không lưu được trạng thái:",
                        error
                    );
                }
            }

            /* ==============================
               ĐỔI MÀU THẺ
            ============================== */

            function applyHeaderState() {
                if (isGreen) {
                    cardHeader.style.backgroundColor = "#38a754";

                    headerText.textContent =
                        "将二维码对准扫描器刷码进场";

                    leaveAction.classList.remove("hidden");
                    qrActions.classList.add("has-leave");
                } else {
                    cardHeader.style.backgroundColor = "#f2c75b";

                    headerText.textContent =
                        "将二维码对准扫描器刷码出场";

                    leaveAction.classList.add("hidden");
                    qrActions.classList.remove("has-leave");
                }
            }

            function toggleHeaderColor() {
                isGreen = !isGreen;
                timerStart = Date.now();

                applyHeaderState();
                saveLocalState();
                updateClockAndTimer();
            }

            /* ==============================
               ĐỒNG HỒ VÀ BỘ ĐẾM
            ============================== */

            function updateClockAndTimer() {
                const now = new Date();

                currentTime.textContent = formatDateTime(now);

                const elapsed = Math.max(
                    0,
                    Math.floor((Date.now() - timerStart) / 1000)
                );

                const hours = Math.floor(elapsed / 3600);
                const minutes = Math.floor((elapsed % 3600) / 60);
                const seconds = elapsed % 60;

                statusTimer.textContent =
                    `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            /* ==============================
               TẠO QR HIỂN THỊ
            ============================== */

            function generateQRCode() {
                if (typeof QRCode === "undefined") {
                    qrcodeElement.textContent =
                        "Không tải được thư viện QR. Hãy kiểm tra Internet.";
                    return;
                }

                const now = new Date();

                const qrToken =
                    Math.random().toString(36).substring(2) +
                    Date.now().toString(36);

                const accessData =
                    `${QR_ENDPOINT}?id=${encodeURIComponent(EMPLOYEE_ID)}` +
                    `&name=${encodeURIComponent(EMPLOYEE_NAME)}` +
                    `&time=${encodeURIComponent(formatDateTime(now))}` +
                    `&token=${encodeURIComponent(qrToken)}`;

                qrcodeElement.innerHTML = "";

                new QRCode(qrcodeElement, {
                    text: accessData,
                    width: QR_SIZE,
                    height: QR_SIZE,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            /* ==============================
               NÚT LÀM MỚI QR
            ============================== */

            refreshQRCode.addEventListener("click", () => {
                generateQRCode();
            });

            refreshQRCode.addEventListener("keydown", (event) => {
                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    generateQRCode();
                }
            });

            /* ==============================
               GIỮ NGOÀI THẺ 3 GIÂY
            ============================== */

            function startPress(event) {
                if (
                    event.target &&
                    typeof event.target.closest === "function" &&
                    event.target.closest(".card")
                ) {
                    return;
                }

                cancelPress();

                pressTimer = setTimeout(() => {
                    pressTimer = null;
                    toggleHeaderColor();
                }, HOLD_DURATION);
            }

            function cancelPress() {
                if (pressTimer !== null) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
            }

            document.addEventListener(
                "touchstart",
                startPress,
                { passive: true }
            );

            document.addEventListener("touchend", cancelPress);
            document.addEventListener("touchcancel", cancelPress);

            document.addEventListener("mousedown", startPress);
            document.addEventListener("mouseup", cancelPress);
            document.addEventListener("mouseleave", cancelPress);

            /* ==============================
               NGĂN CUỘN TRANG
            ============================== */

            document.addEventListener(
                "touchmove",
                (event) => {
                    event.preventDefault();
                },
                { passive: false }
            );

            document.addEventListener(
                "wheel",
                (event) => {
                    event.preventDefault();
                },
                { passive: false }
            );

            /* ==============================
               KHỞI TẠO
            ============================== */

            employeeHeader.textContent =
                `${EMPLOYEE_ID} (${EMPLOYEE_NAME})`;

            loadLocalState();
            applyHeaderState();
            updateClockAndTimer();
            generateQRCode();

            setInterval(updateClockAndTimer, 1000);

            window.addEventListener("pagehide", cancelPress);
        })();
    </script>

</body>
</html>
