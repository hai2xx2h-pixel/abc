<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#e2e4e9">
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <link rel="apple-touch-icon" href="icon.png">
    <title>二维码通行</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #2f3347;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft YaHei", sans-serif;
            background-image: url("background.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-status-bar {
            width: 100%;
            height: 44px;
            background-color: #e2e4e9;
            flex-shrink: 0;
        }

        .header {
            margin-top: 25px;
            font-size: 19px;
            color: #f3c759;
            font-weight: 500;
            text-align: center;
        }

        .card {
            margin-top: 20px;
            width: 82%;
            max-width: 310px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background-color: #ebad25;
            padding: 15px 8px;
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            font-weight: 400;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            position: relative;
        }

        .circle1, .circle2 {
            position: absolute;
            background-color: #2f3347;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            bottom: -6px;
            z-index: 10;
        }

        .circle1 {
            left: -6px;
        }

        .circle2 {
            right: -6px;
        }

        /* Nới rộng padding trên/dưới để kéo dài phần nền màu trắng */
        .card-body {
            background-color: #ffffff;
            padding: 22px 15px 22px 15px;
            text-align: center;
            color: #000;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .time {
            font-size: 15px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            line-height: 1.2;
            width: 100%;
        }

        /* Tăng kích thước khung chứa mã QR lên 210px x 210px */
        #qrcode {
            width: 210px;
            height: 210px;
            min-width: 210px;
            min-height: 210px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #qrcode img, 
        #qrcode canvas {
            width: 210px !important;
            height: 210px !important;
            max-width: 210px !important;
            max-height: 210px !important;
            display: block !important;
            margin: 0 auto !important;
        }

        .refresh {
            margin-top: 16px;
            width: 100%;
        }

        .refresh-title {
            cursor: pointer;
            font-size: 14px;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: inline-block;
        }

        .note {
            margin: 25px 10% 0 10%;
            font-size: 14px;
            color: #e5d8b7;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="top-status-bar"></div>

    <div class="header">V25111639(Nguyễn Văn Hải)</div>
    
    <div class="card">
        <div class="card-header">
            将二维码对准扫描器刷码出场
            <div class="circle1"></div>
            <div class="circle2"></div>
        </div>

        <div class="card-body">
            <div class="time" id="currentTime">--</div>
            <div id="qrcode"></div>
            <div class="refresh">
                <span onclick="generateQRCode(event)" class="refresh-title">刷新二维码</span>
            </div>
        </div>
    </div>

    <div class="note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>

    <script>
        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('currentTime').textContent = formatted;
        }

        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            const employeeId = "V25111639";
            const employeeName = "Nguyễn Văn Hải";
            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
            const accessData = `https://Wistron.com/access?id=${employeeId}&name=${encodeURIComponent(employeeName)}&time=${encodeURIComponent(formattedTime)}&token=${uniqueToken}`;
            
            const qrcodeElement = document.getElementById('qrcode');
            qrcodeElement.innerHTML = ""; 

            new QRCode(qrcodeElement, {
                text: accessData,
                width: 210,
                height: 210,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        updateTime();
        generateQRCode();
        setInterval(updateTime, 1000);
    </script>
</body>

</html>
