<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- STATUS BAR: NỀN SÁNG + ICON ĐEN -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- MÀU HỆ THỐNG PHÍA TRÊN -->
    <meta name="theme-color" content="#f5f5f5">
    <meta name="apple-mobile-web-app-title" content="员工码">

    <title>员工码</title>

    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* =====================================================
           BODY
        ===================================================== */
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang SC",
                "Helvetica Neue",
                Arial,
                sans-serif;
            color: #ffffff;
            overscroll-behavior: none;
        }

        /* STATUS BAR WHITE AREA */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top);
            z-index: 10000;
            background-color: #f5f5f5;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           EMPLOYEE APP
        ===================================================== */
        .app-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-color: #30364f;
            background-image: radial-gradient(circle at center, #3a415e 0%, #30364f 100%);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* =====================================================
           EMPLOYEE HEADER
        ===================================================== */
        .header {
            width: 100%;
            margin-top: 30px;
            padding: 0 10px;
            color: #F5D57F;
            font-size: 17px;
            font-weight: 300;
            line-height: 1.25;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
        }

        /* =====================================================
           CARD
        ===================================================== */
        .card {
            width: 68%;
            max-width: 300px;
            margin-top: 15px;
            position: relative;
            overflow: visible;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* =====================================================
           CARD HEADER
        ===================================================== */
        .card-header {
            width: 100%;
            height: 64px;
            min-height: 64px;
            padding: 12px 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #f2c75b;
            color: #ffffff;
            border-radius: 8px 8px 0 0;
            transition: background-color 0.25s ease;
            cursor: pointer;
        }

        #headerText {
            display: block;
            width: 100%;
            color: #ffffff;
            font-size: 14px;
            font-weight: 300;
            line-height: 1.35;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
        }

        /* =====================================================
           SIDE CIRCLES
        ===================================================== */
        .circle1,
        .circle2 {
            position: absolute;
            width: 12px;
            height: 12px;
            bottom: -6px;
            z-index: 10;
            border-radius: 50%;
            background-color: #30364f;
        }

        .circle1 {
            left: -6px;
        }

        .circle2 {
            right: -6px;
        }

        /* =====================================================
           CARD BODY
        ===================================================== */
        .card-body {
            width: 100%;
            padding: 13px 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            color: #111111;
            text-align: center;
            border-radius: 0 0 8px 8px;
        }

        /* =====================================================
           TIME
        ===================================================== */
        .time {
            width: 100%;
            margin: 0 0 10px;
            color: #111111;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.2;
            letter-spacing: 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* =====================================================
           QR
        ===================================================== */
        #qrcode {
            width: 210px;
            height: 210px;
            min-width: 210px;
            min-height: 210px;
            max-width: 210px;
            max-height: 210px;
            margin: 0 auto;
            padding: 0;
            display: block;
            overflow: hidden;
            background-color: #ffffff;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        #qrcode img,
        #qrcode canvas {
            display: block !important;
            width: 210px !important;
            height: 210px !important;
            min-width: 210px !important;
            min-height: 210px !important;
            max-width: 210px !important;
            max-height: 210px !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            transform: none !important;
            filter: none !important;
            image-rendering: pixelated;
        }

        /* =====================================================
           ACTION ROW
        ===================================================== */
        .refresh {
            width: 100%;
            min-height: 18px;
            margin-top: 9px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =====================================================
           ACTION TEXT
        ===================================================== */
        .leave-action,
        .refresh-title {
            color: #666666;
            font-size: 12px;
            font-weight: 300;
            line-height: 1.2;
            white-space: nowrap;
            cursor: pointer;
        }

        .refresh.has-leave {
            justify-content: center;
            gap: 18px;
        }

        .leave-action.hidden {
            display: none !important;
        }

        .leave-action:active,
        .refresh-title:active {
            opacity: 0.65;
        }

        /* =====================================================
           STATUS
        ===================================================== */
        .status-box {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .status-label {
            color: #9AE7B3;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.2;
            animation: pulse-green 1.2s infinite ease-in-out;
        }

        .status-timer {
            margin-top: 4px;
            color: #16C653;
            font-size: 16px;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: 0.2px;
            opacity: 1 !important;
            font-variant-numeric: tabular-nums;
        }

        @keyframes pulse-green {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* =====================================================
           NOTE
        ===================================================== */
        .note {
            width: 265px;
            max-width: 68%;
            margin: 28px auto 0;
            padding: 0;
            color: #E6DCBD;
            font-size: 13px;
            font-weight: 300;
            line-height: 1.6;
            letter-spacing: 0;
            text-align: left;
            text-indent: 2em;
            white-space: normal;
            word-break: normal;
            overflow-wrap: normal;
        }
    </style>
</head>

<body>

    <!-- =================================================
         EMPLOYEE APP (MÀN HÌNH CHÍNH TRỰC TIẾP)
    ================================================== -->
    <main id="appScreen" class="app-screen">

        <!-- EMPLOYEE NAME -->
        <div id="employeeHeader" class="header">
            V25111639(Nguyễn Văn Hải)
        </div>

        <!-- =================================================
             CARD
        ================================================== -->
        <div class="card">

            <div id="cardHeader" class="card-header" title="点击切换 进场 / 出场">
                <span id="headerText">
                    将二维码对准扫描器刷码出场
                </span>

                <div class="circle1"></div>
                <div class="circle2"></div>
            </div>

            <div class="card-body">

                <!-- TIME -->
                <div id="currentTime" class="time">
                    --
                </div>

                <!-- QR -->
                <div id="qrcode"></div>

                <!-- QR ACTIONS -->
                <div id="qrActions" class="refresh">
                    <span id="leaveAction" class="leave-action hidden">
                        申请离场
                    </span>

                    <span id="refreshQRCode" class="refresh-title">
                        刷新二维码
                    </span>
                </div>

                <!-- STATUS -->
                <div class="status-box">
                    <div class="status-label">
                        已生效
                    </div>

                    <div id="statusTimer" class="status-timer">
                        00:00:00
                    </div>
                </div>

            </div>

        </div>

        <!-- =================================================
             NOTE
        ================================================== -->
        <div class="note">
            尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
        </div>

    </main>


    <!-- =================================================
         JAVASCRIPT LOGIC
    ================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const employeeId = "V25111639";
            const employeeName = "Nguyễn Văn Hải";

            const cardHeader = document.getElementById("cardHeader");
            const headerText = document.getElementById("headerText");
            const currentTimeEl = document.getElementById("currentTime");
            const qrcodeContainer = document.getElementById("qrcode");
            const refreshQRCodeBtn = document.getElementById("refreshQRCode");
            const statusTimer = document.getElementById("statusTimer");

            const TIMER_STORAGE_KEY = "qr_access_start_time";
            const COLOR_STORAGE_KEY = "qr_access_color";

            let isGreen = localStorage.getItem(COLOR_STORAGE_KEY) === "green";

            function applyHeaderColor() {
                if (isGreen) {
                    cardHeader.style.backgroundColor = "#38a754";
                    headerText.textContent = "将二维码对准扫描器刷码进场";
                } else {
                    cardHeader.style.backgroundColor = "#f2c75b";
                    headerText.textContent = "将二维码对准扫描器刷码出场";
                }
            }

            // Khôi phục hoặc tạo mới mốc thời gian bắt đầu bộ đếm
            let startTime = localStorage.getItem(TIMER_STORAGE_KEY);
            if (!startTime) {
                startTime = Date.now();
                localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
            } else {
                startTime = Number(startTime);
            }

            function resetTimer() {
                startTime = Date.now();
                localStorage.setItem(TIMER_STORAGE_KEY, String(startTime));
                statusTimer.textContent = "00:00:00";
                updateAllTimers();
            }

            function toggleHeaderColor() {
                isGreen = !isGreen;
                localStorage.setItem(COLOR_STORAGE_KEY, isGreen ? "green" : "yellow");
                applyHeaderColor();
                resetTimer();
            }

            // Nhấp vào header thẻ để đổi màu xanh / vàng và reset đếm giờ
            cardHeader.addEventListener("click", () => {
                toggleHeaderColor();
            });

            function updateAllTimers() {
                const now = new Date();
                const formattedTime =
                    `${now.getFullYear()}-` +
                    `${String(now.getMonth() + 1).padStart(2, "0")}-` +
                    `${String(now.getDate()).padStart(2, "0")} ` +
                    `${String(now.getHours()).padStart(2, "0")}:` +
                    `${String(now.getMinutes()).padStart(2, "0")}:` +
                    `${String(now.getSeconds()).padStart(2, "0")}`;

                currentTimeEl.textContent = formattedTime;

                const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startTime) / 1000));
                const hours = Math.floor(elapsedSeconds / 3600);
                const minutes = Math.floor((elapsedSeconds % 3600) / 60);
                const seconds = elapsedSeconds % 60;

                statusTimer.textContent =
                    `${String(hours).padStart(2, "0")}:` +
                    `${String(minutes).padStart(2, "0")}:` +
                    `${String(seconds).padStart(2, "0")}`;
            }

            function generateQRCode(event) {
                if (event && event.currentTarget) {
                    event.currentTarget.blur();
                }

                qrcodeContainer.innerHTML = "";
                const now = new Date();
                const formattedTime =
                    `${now.getFullYear()}-` +
                    `${String(now.getMonth() + 1).padStart(2, "0")}-` +
                    `${String(now.getDate()).padStart(2, "0")} ` +
                    `${String(now.getHours()).padStart(2, "0")}:` +
                    `${String(now.getMinutes()).padStart(2, "0")}:` +
                    `${String(now.getSeconds()).padStart(2, "0")}`;

                const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);

                const accessData =
                    `https://YOUR-AUTHORIZED-DOMAIN/access` +
                    `?id=${encodeURIComponent(employeeId)}` +
                    `&name=${encodeURIComponent(employeeName)}` +
                    `&time=${encodeURIComponent(formattedTime)}` +
                    `&token=${encodeURIComponent(uniqueToken)}`;

                new QRCode(qrcodeContainer, {
                    text: accessData,
                    width: 210,
                    height: 210,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }

            // Khởi chạy hệ thống
            applyHeaderColor();
            updateAllTimers();
            generateQRCode();

            // Cập nhật đồng hồ mỗi giây
            setInterval(updateAllTimers, 1000);

            refreshQRCodeBtn.addEventListener("click", generateQRCode);
        });
    </script>

</body>

</html>
