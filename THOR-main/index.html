<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no " />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js">
    </script>
    <link rel="apple-touch-icon" href="icon.png">
    <title>二维码通行</title>
    <style>
        * {
            box-sizing: border-box;
             margin: 0;
            padding: 0;
        }

        html, 
        body {
            width: 100%;
            min-height: 100vh;
            background-color: #2f3347;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", STHeiti, sans-serif;
            background-image: url("background.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-status-bar {
            width: 100%;
            height: 44px;
            background-color: #e2e4e9;
            flex-shrink: 0;
        }

        .header {
           margin-top: 25px;
            font-size: 17px;
            color: #F5D57F;
            font-weight: 300;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Khung thẻ chính */

        .card {
           margin-top: 20px;
            width: 84%;
            max-width: 290px;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Phần đầu thẻ (Header màu vàng/xanh) */
        .card-header {
            background-color: #f2c75b;
            padding: 14px 8px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 300;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* Hiệu ứng khuyết góc (ticket notch) ở 2 bên mép giữa header và body */
        .circle1,
        .circle2 {
            position: absolute;
            background-color: #2f3347;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            bottom: -7px;
            z-index: 10;
        }

        .circle1 {
            left: -7px;
        }

        .circle2 {
            right: -7px;
        }

        /* Phần thân thẻ chứa mã QR */
        .card-body {
           background-color: #ffffff;
            padding: 16px 15px 14px 15px;
            text-align: center;
            color: #000;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        }

        .time {
            font-size: 14px;
            font-weight: 300;
            color: #111111;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
            line-height: 1.2;
            width: 100%;
        }

        #qrcode {
            width: 200px;
            height: 200px;
            min-width: 200px;
            min-height: 200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .refresh {
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: gray;
        }

        .refresh-title {
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .refresh-title:focus,
        .refresh-title:active {
            outline: none;
            box-shadow: none;
        }

        .status {
            margin-top: 8px;
            color: #00cc66;
            font-size: 16px;
        }

        .note {
            margin: 30px 10%;
            font-size: 14px;
            color: #e5d8b7;
            line-height: 1.7;
            text-align: -webkit-left;
            text-indent: 1.5em;
        }

        .bottom-bar {
            width: 100%;
            height: 4px;
            background-color: transparent;
        }

        img {
            width: 230px;
            height: 230px;
        }

        .refresh-title {
            padding: 0 10px;
        }

        .relative {
            position: relative;
        }

        .circle1 {
            position: absolute;
            background-color: rgb(61, 62, 82);
            height: 12px;
            width: 12px;
            left: -6px;
            border-radius: 50%;
            bottom: -6px;
        }

        .circle2 {
            position: absolute;
            background-color: rgb(61, 62, 82);
            height: 12px;
            width: 12px;
            right: -6px;
            border-radius: 50%;
            bottom: -6px;
        }
    </style>
</head>

<body>
    <div class="header">V23050597(Rays Tran)</div>
    <div class="card">
        <div class="card-header relative">
            <p>将二维码对准扫描器扫码出场</p>
            <div class="circle1"></div>
            <div class="circle2"></div>
        </div>

        <div class="card-body">
            <div class="time" id="currentTime">--</div>
            <div id="qrcode">
            </div>
            <div class="refresh">
                <p onclick="generateQRCode(event)" class="refresh-title">刷新二维码</p>
            </div>
            <!-- <div class="status">已生效</div> -->
        </div>
    </div>
    <div class="note">
        尊敬的员工您好，您已进入企业涉密区域，出于企业安全考虑，您的手机摄像头将被禁止拍摄，感谢您的配合。
    </div>
    <div class="bottom-bar"></div>
    <script>
        let qrCodeInstance;

        function pad(num) {
            return num < 10 ? '0' + num : num;
        }

        function updateTime() {
            const now = new Date();
            const formatted = `${now.getFullYear()}-${now.getMonth() + 1}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
            document.getElementById('currentTime').textContent = formatted;
        }

        function generateQRCode(event) {
            if (event && event.currentTarget) {
                event.currentTarget.blur();
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const formattedTime = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;

            const employeeId = "V23050597";
            const employeeName = "RaysTran";
            const uniqueToken = Math.random().toString(36).substring(2) + Date.now().toString(36);
            const accessData =
                `https://Wistron.com/access?id=${employeeId}&name=${encodeURIComponent(employeeName)}&time=${encodeURIComponent(formattedTime)}&token=${uniqueToken}`;
            const qrcodeElement = document.getElementById('qrcode');
            if (qrCodeInstance) {
                qrCodeInstance.clear();
                qrCodeInstance.makeCode(accessData);
            } else {
                qrCodeInstance = new QRCode(qrcodeElement, {
                    text: accessData,
                    width: 230,
                    height: 230,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        // Initial
        updateTime();
        generateQRCode();
        // Update every second
        setInterval(updateTime, 1000);

        function fadeElement(selector, speed = 0.02) {
            const element = document.querySelector(selector);
            if (!element) {
                console.error("Không tìm thấy phần tử với selector:", selector);
                return;
            }

            let opacity = 1;
            let fadingOut = true;

            function animate() {
                if (fadingOut) {
                    opacity -= speed;
                    if (opacity <= 0) {
                        opacity = 0;
                        fadingOut = false;
                    }
                } else {
                    opacity += speed;
                    if (opacity >= 1) {
                        opacity = 1;
                        fadingOut = true;
                    }
                }
                element.style.opacity = opacity;
                requestAnimationFrame(animate);
            }

            animate();
        }

        fadeElement('.status');
    </script>
</body>

</html>
