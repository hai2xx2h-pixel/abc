<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f5">

    <!-- Library QR Code -->
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

    <title>二维码通行</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* =====================================================
           BODY
        ===================================================== */
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Text",
                "PingFang SC",
                "Helvetica Neue",
                Arial,
                sans-serif;
            color: #ffffff;
            overscroll-behavior: none;
        }

        /* STATUS BAR WHITE AREA */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: env(safe-area-inset-top);
            z-index: 10000;
            background-color: #f5f5f5;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        /* =====================================================
           EMPLOYEE APP SCREEN
        ===================================================== */
        .app-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            background-color: #30364f;
            background-image: radial-gradient(circle at center, #3a415e 0%, #30364f 100%);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        /* =====================================================
           HEADER
        ===================================================== */
        .header {
            width: 100%;
            margin-top: 30px;
            padding: 0 10px;
            color: #F5D57F;
            font-size: 17px;
            font-weight: 300;
            line-height: 1.25;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
        }

        /* =====================================================
           CARD
        ===================================================== */
        .card {
            width: 68%;
            max-width: 300px;
            margin-top: 15px;
            position: relative;
            overflow: visible;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }

        /* =====================================================
           CARD HEADER
